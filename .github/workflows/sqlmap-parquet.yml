name: sqlmap-dump-to-parquet

# Cron + manual workflow: run sqlmap against a saved HTTP request, dump all
# non-system DB data as CSV, convert CSVs to Parquet, verify, and upload artifacts.
#
# WHERE TO PUT login-request.txt (instructor gives it on practical day):
#   1) Replace ./login-request.txt in the repo root, commit, and push.  (simplest)
#   2) OR set Actions secret SQLMAP_REQUEST_B64 to base64 of the request file.
#      The workflow materializes it at runtime and does not commit it.
#
# The target host from the request must be listed in targets/allowlist.txt or in
# the ALLOWED_HOSTS secret, unless allow_unlisted is explicitly set for a lab run.

on:
  schedule:
    # Bi-weekly (twice a week: Mondays and Thursdays at 03:00 UTC) -> dumps qbank
    - cron: "0 3 * * 1,4"
    # Monthly (1st of every month at 03:00 UTC) -> dumps faculty, coordinator, detail
    - cron: "0 3 1 * *"
  workflow_dispatch:
    inputs:
      cadence:
        description: "Target table cadence (all, biweekly, monthly, custom)"
        type: choice
        options:
          - "all"
          - "biweekly"
          - "monthly"
          - "custom"
        default: "all"
      targets_file:
        description: "Custom targets file path if cadence is 'custom'"
        type: string
        default: ""
      request_path:
        description: "Request file in repo (raw HTTP, Burp XML, HAR, or bare URL)"
        type: string
        default: "login-request.txt"
      database:
        description: "Specific database to dump (-D), leave blank for all"
        type: string
        default: ""
      tables:
        description: "Specific table(s) to dump (-T, comma-separated), leave blank for all"
        type: string
        default: ""
      proxy:
        description: "HTTP/SOCKS proxy URL (optional, e.g. socks5://127.0.0.1:9050)"
        type: string
        default: ""
      use_tor:
        description: "Route traffic through Tor (not needed on GitHub Actions since runner IP is already an anonymous Azure cloud IP)"
        type: boolean
        default: false
      threads:
        description: "sqlmap threads (1-10)"
        type: string
        default: "3"
      delay:
        description: "Delay between requests in seconds"
        type: string
        default: "0.3"
      level:
        description: "sqlmap --level (1-5)"
        type: string
        default: "1"
      risk:
        description: "sqlmap --risk (1-3)"
        type: string
        default: "1"
      max_runtime_minutes:
        description: "Hard deadline for the sqlmap run"
        type: string
        default: "350"
      convert_workers:
        description: "Parquet conversion workers (1 = single worker, 0 = all cores)"
        type: string
        default: "1"
      infer_types:
        description: "Promote int64/float64/bool columns instead of all-text"
        type: boolean
        default: false
      map_sqlmap_null:
        description: "Convert sqlmap's literal NULL token to a real Parquet NULL"
        type: boolean
        default: false
      build_duckdb_catalog:
        description: "Build catalog.duckdb with one view per table"
        type: boolean
        default: true
      upload_to_s3:
        description: "Sync the Parquet tree to AWS_BUCKET"
        type: boolean
        default: false
      allow_unlisted:
        description: "Skip allowlist check (authorized lab targets only)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: sqlmap-dump-to-parquet
  cancel-in-progress: false

env:
  SQLMAP_REF: "1.9.11"
  PYTHONUNBUFFERED: "1"
  PYTHONIOENCODING: "utf-8"
  OUTPUT_DIR: sqlmap-output
  PARQUET_DIR: parquet
  REQUEST_PATH: ${{ inputs.request_path || 'login-request.txt' }}
  PROXY: ${{ inputs.proxy || '' }}
  USE_TOR: ${{ inputs.use_tor || false }}
  DATABASE: ${{ inputs.database || '' }}
  TABLES: ${{ inputs.tables || '' }}
  THREADS: ${{ inputs.threads || '3' }}
  DELAY: ${{ inputs.delay || '0.3' }}
  LEVEL: ${{ inputs.level || '1' }}
  RISK: ${{ inputs.risk || '1' }}
  MAX_MINUTES: ${{ inputs.max_runtime_minutes || '350' }}
  CONVERT_WORKERS: ${{ inputs.convert_workers || '1' }}
  INFER_FLAG: ${{ inputs.infer_types && '--infer-types' || '' }}
  NULL_FLAG: ${{ inputs.map_sqlmap_null && '--null-token NULL' || '' }}
  CATALOG_FLAG: ${{ (github.event_name == 'schedule' || inputs.build_duckdb_catalog) && '--catalog' || '' }}
  UPLOAD_S3: ${{ inputs.upload_to_s3 || false }}
  ALLOW_UNLISTED_FLAG: ${{ inputs.allow_unlisted && '--allow-unlisted' || '' }}

jobs:
  dump-and-convert:
    name: Dump and convert
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install conversion dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -c "import pyarrow, duckdb; print('pyarrow', pyarrow.__version__, '| duckdb', duckdb.__version__)"

      - name: Install sqlmap (pinned)
        run: |
          git clone --depth 1 --branch "$SQLMAP_REF" https://github.com/sqlmapproject/sqlmap.git .sqlmap \
            || git clone --depth 1 https://github.com/sqlmapproject/sqlmap.git .sqlmap
          python .sqlmap/sqlmap.py --version --non-interactive

      - name: Set up Tor anonymity service
        if: env.USE_TOR == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tor
          sudo /etc/init.d/tor start || sudo service tor start
          sleep 4

      - name: Materialize request file
        env:
          SQLMAP_REQUEST_B64: ${{ secrets.SQLMAP_REQUEST_B64 }}
        run: |
          set -euo pipefail
          mkdir -p requests
          if [ -n "${SQLMAP_REQUEST_B64:-}" ]; then
            printf '%s' "$SQLMAP_REQUEST_B64" | base64 -d > requests/live.http
            request=requests/live.http
            echo "::notice::request supplied via SQLMAP_REQUEST_B64 secret"
          else
            request=""
            for candidate in "$REQUEST_PATH" login-request.txt requests/login-request.txt requests/target.http; do
              if [ -s "$candidate" ]; then request="$candidate"; break; fi
            done
            if [ -z "$request" ]; then
              echo "::error::No request file found. Upload login-request.txt to the repo root, or set SQLMAP_REQUEST_B64 secret."
              echo "Looked for: $REQUEST_PATH, login-request.txt, requests/login-request.txt, requests/target.http"
              exit 1
            fi
          fi
          echo "REQUEST_FILE=$request" >> "$GITHUB_ENV"
          echo "Using request file: $request"
          head -n 1 "$request" | sed 's/\r$//'

      - name: Resolve allowlist
        env:
          ALLOWED_HOSTS: ${{ secrets.ALLOWED_HOSTS }}
        run: |
          set -euo pipefail
          if [ -n "${ALLOWED_HOSTS:-}" ]; then
            printf '%s\n' "$ALLOWED_HOSTS" > targets/allowlist.runtime.txt
            allowlist=targets/allowlist.runtime.txt
          else
            allowlist=targets/allowlist.txt
          fi
          echo "ALLOWLIST=$allowlist" >> "$GITHUB_ENV"
          echo "--- allowlist ---"
          cat "$allowlist" || true

      - name: Preflight (target must be allowlisted)
        run: |
          python scripts/preflight.py \
            --request "$REQUEST_FILE" \
            --allowlist "$ALLOWLIST" \
            $ALLOW_UNLISTED_FLAG

      - name: Resolve targets cadence
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "schedule" ]; then
            day_of_month=$(date -u +%d | sed 's/^0*//')
            if [ "$day_of_month" -eq 1 ]; then
              echo "Scheduled trigger: Monthly cadence (1st of month)"
              target_file="targets/monthly.txt"
            else
              echo "Scheduled trigger: Bi-weekly cadence (Twice a week)"
              target_file="targets/biweekly.txt"
            fi
          else
            cadence="${{ inputs.cadence || 'all' }}"
            if [ "$cadence" = "biweekly" ]; then
              target_file="targets/biweekly.txt"
            elif [ "$cadence" = "monthly" ]; then
              target_file="targets/monthly.txt"
            elif [ "$cadence" = "custom" ] && [ -n "${{ inputs.targets_file }}" ]; then
              target_file="${{ inputs.targets_file }}"
            else
              target_file="targets.txt"
            fi
          fi
          echo "TARGETS_FILE=$target_file" >> "$GITHUB_ENV"
          echo "Using target cadence file: $target_file"
          cat "$target_file" || true

      - name: Run sqlmap
        id: sqlmap
        continue-on-error: true
        run: |
          set -euo pipefail
          extra_db_args=()
          if [ -n "$DATABASE" ]; then extra_db_args+=("-D" "$DATABASE"); fi
          if [ -n "$TABLES" ]; then extra_db_args+=("-T" "$TABLES"); fi
          if [ -n "$PROXY" ]; then extra_db_args+=("--proxy" "$PROXY"); fi
          if [ "$USE_TOR" = "true" ]; then extra_db_args+=("--tor"); fi
          if [ -f "$TARGETS_FILE" ]; then extra_db_args+=("--targets-file" "$TARGETS_FILE"); fi
          python scripts/run_sqlmap.py \
            --sqlmap-dir .sqlmap \
            --request "$REQUEST_FILE" \
            --allowlist "$ALLOWLIST" \
            --output-dir "$OUTPUT_DIR" \
            --threads "$THREADS" \
            --delay "$DELAY" \
            --level "$LEVEL" \
            --risk "$RISK" \
            --max-runtime "$(( MAX_MINUTES * 60 ))" \
            "${extra_db_args[@]}" \
            $ALLOW_UNLISTED_FLAG

      - name: Restore previous release data (preserve all tables)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p previous_release "$PARQUET_DIR"
          echo "Restoring table-wise Parquet assets from latest release..."
          if gh release download latest -p "*.parquet" --dir previous_release 2>/dev/null; then
            for f in previous_release/*.parquet; do
              [ -e "$f" ] || continue
              fname=$(basename "$f")
              # Each asset is named <db>.<table_name>.parquet
              if [[ "$fname" == *.*.parquet ]]; then
                db="${fname%%.*}"
                table="${fname#*.}"
                if [ "$db" != "_" ] && [ "$db" != "__" ]; then
                  mkdir -p "$PARQUET_DIR/$db"
                  cp "$f" "$PARQUET_DIR/$db/$table"
                  echo "Restored $fname -> $PARQUET_DIR/$db/$table"
                fi
              fi
            done
            echo "Successfully restored existing tables from latest release."
          else
            echo "No previous release found or no existing parquet assets; starting clean."
          fi

      - name: Convert CSV dumps to Parquet
        if: always() && hashFiles('sqlmap-output/**/*.csv') != ''
        run: |
          python scripts/csv_to_parquet.py \
            --dump-root "$OUTPUT_DIR" \
            --out "$PARQUET_DIR" \
            --workers "$CONVERT_WORKERS" \
            --compression zstd \
            --checksum \
            --run-meta "$OUTPUT_DIR/run.json" \
            --summary-md "$PARQUET_DIR/summary.md" \
            $INFER_FLAG $NULL_FLAG $CATALOG_FLAG

      - name: Verify Parquet
        if: always() && hashFiles('parquet/manifest.json') != ''
        run: |
          python scripts/verify_parquet.py --manifest parquet/manifest.json --checksum --duckdb

      - name: Package release assets
        if: always() && hashFiles('parquet/manifest.json') != ''
        run: |
          python scripts/package_release_assets.py --parquet-dir "$PARQUET_DIR" --out-dir release_assets

      - name: Upload to GitHub Release
        if: always() && hashFiles('release_assets/**') != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest Data Dumps (Parquet & SQLite)"
          files: |
            release_assets/*
          prerelease: false
          draft: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Report size
        if: always() && hashFiles('parquet/**') != ''
        run: |
          echo "parquet tree: $(du -sh "$PARQUET_DIR" | cut -f1)"
          find "$PARQUET_DIR" -name '*.parquet' -size +1G -printf '%s %p\n' | sort -rn || true

      - name: Publish summary
        if: always()
        run: |
          {
            if [ -f "$PARQUET_DIR/summary.md" ]; then
              cat "$PARQUET_DIR/summary.md"
            else
              echo "## sqlmap -> Parquet"
              echo ""
              echo "No tables were dumped. Check the **Run sqlmap** step and \`sqlmap-console.log\`."
              echo ""
              echo "Expected request file: \`$REQUEST_PATH\` (or \`login-request.txt\` in repo root, or \`SQLMAP_REQUEST_B64\` secret)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Parquet artifact
        if: always() && hashFiles('parquet/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: parquet-${{ github.run_id }}
          path: |
            parquet/
          if-no-files-found: warn
          retention-days: 90
          compression-level: 0

      - name: Upload logs
        if: always() && hashFiles('sqlmap-output/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: sqlmap-logs-${{ github.run_id }}
          path: |
            sqlmap-output/run.json
            sqlmap-output/sqlmap-console.log
            sqlmap-output/**/log
          if-no-files-found: warn
          retention-days: 30

      - name: Sync to S3
        if: always() && env.UPLOAD_S3 == 'true' && hashFiles('parquet/**') != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_BUCKET: ${{ secrets.AWS_BUCKET }}
          AWS_PREFIX: ${{ secrets.AWS_PREFIX }}
        run: |
          aws s3 sync "$PARQUET_DIR" "s3://$AWS_BUCKET/${AWS_PREFIX:-sqlmap}/${{ github.run_id }}/" \
            --only-show-errors --sse AES256

      - name: Gate on sqlmap result
        if: always()
        run: |
          python - <<'PY'
          import json, pathlib, sys

          run = pathlib.Path("sqlmap-output/run.json")
          if not run.exists():
              print("::error::sqlmap did not run (preflight block, missing request, missing sqlmap, or setup failure)")
              sys.exit(1)

          meta = json.loads(run.read_text(encoding="utf-8"))
          print(f"sqlmap exit={meta['returncode']} timeout={meta['timed_out']} duration={meta['duration_seconds']}s")
          if not meta["ok"]:
              print("::error::sqlmap run failed; see sqlmap-console.log artifact")
              sys.exit(1)
          print("::notice::sqlmap finished cleanly")
          PY
